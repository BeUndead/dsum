plugins {
    id 'java'
}

group = 'com.com'
version = '1.2.0'
description = 'dsum'

// No toolchain pin: the build runs on whatever JDK 17+ is installed (17, 21, 25, ...).
// options.release compiles against the Java 17 API and emits Java 17 bytecode either
// way, so the jar is identical and runs on any Java 17 or newer runtime.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.5.4'
    // Needed for the global hotkeys: the JVM only ever sees key events aimed at its own windows,
    // so watching the keyboard while the emulator has focus takes a native hook.
    implementation 'com.github.kwhat:jnativehook:2.2.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

task runnableJar(type: Jar) {
    manifest {
        attributes 'Main-Class': "com.com.dsum.DsumApplication",
                // jnativehook loads a native library, which Java 24+ warns about and will eventually
                // block outright.  Declaring it here keeps 'java -jar' quiet without a command line flag.
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
    archiveBaseName = "${rootProject.name}"
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
